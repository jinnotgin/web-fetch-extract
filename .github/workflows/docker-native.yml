name: Docker Native Images

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to build, for example 0.1.0 or v0.1.0"
        required: true
        type: string
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  build-arch:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64

    steps:
      - name: Resolve build target
        id: target
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#refs/tags/}"
            if [[ "${VERSION}" != v* ]]; then
              VERSION="v${VERSION}"
            fi

            if [[ ! "${VERSION}" =~ ^v[0-9][0-9A-Za-z._-]*$ ]]; then
              echo "Version must look like 0.1, 0.1.0, v0.1, or v0.1.0." >&2
              exit 1
            fi

            echo "ref=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "arch_tag=${VERSION}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "ref=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "arch_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=" >> "$GITHUB_OUTPUT"
            echo "arch_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.ref }}

      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build native image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.image.outputs.name }}:${{ steps.target.outputs.arch_tag }}-${{ matrix.suffix }}

  manifest:
    name: Publish multi-arch manifest
    runs-on: ubuntu-24.04
    needs:
      - build-arch
    if: github.event_name != 'pull_request'

    steps:
      - name: Resolve build target
        id: target
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#refs/tags/}"
            if [[ "${VERSION}" != v* ]]; then
              VERSION="v${VERSION}"
            fi

            if [[ ! "${VERSION}" =~ ^v[0-9][0-9A-Za-z._-]*$ ]]; then
              echo "Version must look like 0.1, 0.1.0, v0.1, or v0.1.0." >&2
              exit 1
            fi

            echo "arch_tag=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "primary_tag=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "release_tag=" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "arch_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "primary_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "release_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "arch_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "primary_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "release_tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish primary manifest
        run: |
          docker buildx imagetools create \
            -t "${{ steps.image.outputs.name }}:${{ steps.target.outputs.primary_tag }}" \
            "${{ steps.image.outputs.name }}:${{ steps.target.outputs.arch_tag }}-amd64" \
            "${{ steps.image.outputs.name }}:${{ steps.target.outputs.arch_tag }}-arm64"

      - name: Publish latest manifest
        if: github.ref == 'refs/heads/main'
        run: |
          docker buildx imagetools create \
            -t "${{ steps.image.outputs.name }}:latest" \
            "${{ steps.image.outputs.name }}:${{ steps.target.outputs.arch_tag }}-amd64" \
            "${{ steps.image.outputs.name }}:${{ steps.target.outputs.arch_tag }}-arm64"

      - name: Publish release manifest
        if: steps.target.outputs.release_tag != ''
        run: |
          docker buildx imagetools create \
            -t "${{ steps.image.outputs.name }}:${{ steps.target.outputs.release_tag }}" \
            "${{ steps.image.outputs.name }}:${{ steps.target.outputs.arch_tag }}-amd64" \
            "${{ steps.image.outputs.name }}:${{ steps.target.outputs.arch_tag }}-arm64"
