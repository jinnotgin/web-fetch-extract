openapi: 3.1.0
info:
  title: Web Fetch Extract Service
  version: 0.2.0
  description: Fetches public URLs and extracts bounded readable text from HTML, plain text, PDFs, images, and rendered pages.
servers:
  - url: http://localhost:8080/v1
security:
  - bearerAuth: []
paths:
  /health:
    get:
      summary: Health check
      security: []
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /ready:
    get:
      summary: Readiness check
      security: []
      responses:
        "200":
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
  /extract:
    post:
      summary: Fetch and extract readable text from a public URL
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtractRequest"
      responses:
        "200":
          description: Extraction result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    apiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
  responses:
    Error:
      description: Structured API error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthResponse:
      type: object
      required: [ok, service, version]
      properties:
        ok:
          type: boolean
        service:
          type: string
        version:
          type: string
    ReadyResponse:
      type: object
      required: [ready, checks]
      properties:
        ready:
          type: boolean
        checks:
          type: object
          required: [config, extractors]
          properties:
            config:
              type: boolean
            extractors:
              type: boolean
    ExtractRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
        mode:
          type: string
          enum: [auto, html, pdf, text, image, browser]
          default: auto
        maxBytes:
          type: integer
          minimum: 1
        maxPages:
          type: integer
          minimum: 1
        maxTextChars:
          type: integer
          minimum: 1000
          default: 500000
        chunkSizeChars:
          type: integer
          minimum: 500
          default: 6000
        chunkOverlapChars:
          type: integer
          minimum: 0
          default: 500
        maxChunks:
          type: integer
          minimum: 1
          default: 80
        useBrowserFallback:
          type: boolean
          default: true
        useOcrFallback:
          type: boolean
          default: true
        allowedDomains:
          type: array
          items:
            type: string
        blockedDomains:
          type: array
          items:
            type: string
        includeRawText:
          type: boolean
          default: true
        includeChunks:
          type: boolean
          default: true
        metadataOnly:
          type: boolean
          default: false
    ExtractResponse:
      type: object
      required:
        - requestId
        - url
        - finalUrl
        - retrievedAt
        - contentType
        - contentLength
        - extraction
        - limits
        - warnings
      properties:
        requestId:
          type: string
        url:
          type: string
        finalUrl:
          type: string
        retrievedAt:
          type: string
          format: date-time
        contentType:
          type: string
        contentLength:
          type: [integer, "null"]
        title:
          type: [string, "null"]
        description:
          type: [string, "null"]
        language:
          type: [string, "null"]
        extraction:
          $ref: "#/components/schemas/ExtractionDetails"
        limits:
          $ref: "#/components/schemas/LimitDetails"
        text:
          type: string
        chunks:
          type: array
          items:
            $ref: "#/components/schemas/Chunk"
        warnings:
          type: array
          items:
            type: string
    ExtractionDetails:
      type: object
      properties:
        method:
          type: string
        usedBrowser:
          type: boolean
        usedOcr:
          type: boolean
        pageCount:
          type: [integer, "null"]
        pagesProcessed:
          type: [integer, "null"]
        pagesOcred:
          type: integer
        ocrDurationMs:
          type: [integer, "null"]
        durationMs:
          type: integer
    LimitDetails:
      type: object
      properties:
        truncated:
          type: boolean
        maxBytes:
          type: [integer, "null"]
        maxTextChars:
          type: integer
        maxChunks:
          type: integer
    Chunk:
      type: object
      required: [index, text, charStart, charEnd]
      properties:
        index:
          type: integer
        text:
          type: string
        charStart:
          type: integer
        charEnd:
          type: integer
        pageStart:
          type: integer
        pageEnd:
          type: integer
    ErrorResponse:
      type: object
      required: [requestId, error]
      properties:
        requestId:
          type: string
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
